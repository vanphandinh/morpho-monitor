services:
  morpho:
    build: .
    container_name: morpho
    restart: unless-stopped
    environment:
      # Trong container phải listen mọi interface; host publish 8545 cho MetaMask mobile.
      PROXY_HOST: "0.0.0.0"
    ports:
      - "3000:3000"              # webapp
      - "8545:8545"              # proxy RPC (public) — capture gated by lender sender check
    volumes:
      - ./.env:/app/.env:ro
      - ./config:/app/config:ro
      - presigned_data:/app/data
      # ---- SSL/TLS (Let's Encrypt) ----
      # Mount toàn bộ /etc/letsencrypt vào /certs/ (read-only).
      # Khi chưa có cert, thư mục rỗng không ảnh hưởng — server vẫn chạy HTTP.
      # Để bật HTTPS, set trong .env:
      #   SSL_CERT_PATH=/certs/live/your-domain.com/fullchain.pem
      #   SSL_KEY_PATH=/certs/live/your-domain.com/privkey.pem
      - /etc/letsencrypt:/certs/:ro

  # ── Diagnostic: probe RPC_URLS từ đúng môi trường Docker (profile "debug") ──
  # Chạy: docker compose run --rm probe
  # RED (exit 1) khi ≥1 endpoint eth_call thất bại — feedback loop cho lỗi
  # "[proxy] eth_call forwarding failed" (xem scripts/probe-rpc-endpoints.mjs).
  # Script được MOUNT (không bake vào image) → image cũ vẫn chạy bản probe mới.
  probe:
    build: .
    profiles: ["debug"]
    entrypoint: ["node", "--env-file=/app/.env", "scripts/probe-rpc-endpoints.mjs"]
    volumes:
      - ./.env:/app/.env:ro
      - ./scripts:/app/scripts:ro

volumes:
  presigned_data:
